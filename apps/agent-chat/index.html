<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>browser-models · agent without tools example · Soverius AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="flex h-full flex-col">
      <header class="border-b border-base-300 bg-base-100">
        <nav class="navbar min-h-14 flex-wrap gap-2 px-4">
          <a
            class="flex items-center gap-2 font-semibold"
            href="https://soverius.ai"
            target="_blank"
          >
            <img src="/favicon.svg" alt="Soverius AI" class="size-7" />
            <h1 class="text-base font-semibold">browser-models</h1>
          </a>
          <span class="badge badge-soft badge-primary">Agent, no tools</span>

          <div class="ml-auto flex flex-wrap items-center gap-2">
            <select
              id="model"
              class="select select-sm w-72"
              aria-label="Model"
            ></select>
            <span
              data-testid="model"
              id="status"
              class="badge badge-soft"
            ></span>
            <button
              id="download"
              type="button"
              class="btn btn-primary btn-sm"
              hidden
            >
              Download the model
            </button>
            <progress
              id="progress"
              class="progress progress-primary w-28"
              hidden
            ></progress>
          </div>
        </nav>
        <p class="px-4 pb-1 text-sm opacity-70">
          <code class="font-mono">@soverius-ai/browser-models-agui</code>
          without tools: an AG-UI agent that chats, with thinking, model loading
          and compaction events. Try
          <code class="font-mono">?context=4096</code> with Gemma.
        </p>
        <p id="prompt-api" class="px-4 pb-3 text-sm opacity-70">
          Prompt API: checking…
        </p>
      </header>

      <ol
        id="messages"
        class="mx-auto flex w-full max-w-3xl flex-1 flex-col gap-1 overflow-y-auto p-4"
      ></ol>

      <form id="chat" class="mx-auto flex w-full max-w-3xl gap-2 p-4">
        <input
          id="input"
          type="text"
          class="input flex-1"
          placeholder="Type a message, or try: think about it"
          autocomplete="off"
        />
        <button type="submit" class="btn btn-primary">Send</button>
        <button id="stop" type="button" class="btn" hidden>Stop</button>
      </form>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
