name: Release

# Publishes the @soverius-ai/browser-models packages to npm when a version tag is pushed.
#
# Cut a release:
#
#   pnpm nx release version 0.2.0          # sets the version in the six package.json files
#   git commit -am "chore(release): 0.2.0"
#   git tag v0.2.0 && git push origin main v0.2.0
#
# The tag must match the version in the package.json files; a different one is refused before
# anything is built. A version with a suffix (0.2.0-beta.1) is published under the npm tag
# `next`, not `latest`. Afterwards a GitHub release with generated notes is created.
#
# Started by hand, it is a dry run: it runs the checks and shows what would be published.
#
#   secret NPM_TOKEN   an npm token that may publish the @soverius-ai packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

env:
  PACKAGES: browser-models browser-models-agui browser-models-tools angular react vue

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      DRY_RUN: ${{ github.event_name != 'push' && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the version and the npm token
        run: |
          version=$(node -p "require('./libs/agent/browser-models/package.json').version")
          for package in libs/agent/browser-models libs/agent/browser-models-agui libs/agent/browser-models-tools libs/frameworks/angular libs/frameworks/react libs/frameworks/vue; do
            found=$(node -p "require('./$package/package.json').version")
            if [ "$found" != "$version" ]; then
              echo "::error::$package/package.json is at $found, the others are at $version"
              exit 1
            fi
          done
          if [ -z "$DRY_RUN" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::The tag is $GITHUB_REF_NAME, but the package.json files say $version"
              exit 1
            fi
            if [ -z "$NODE_AUTH_TOKEN" ]; then
              echo "::error::Secret NPM_TOKEN is not set; nothing was published"
              exit 1
            fi
          fi
          # Pre-releases must not become what `npm install` gives by default.
          [[ "$version" == *-* ]] && echo "NPM_TAG=next" >> "$GITHUB_ENV" || echo "NPM_TAG=latest" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # publint needs the built packages, so this also builds them.
      - run: pnpm nx run-many -t lint test typecheck publint -p $PACKAGES

      - name: Publish to npm
        run: pnpm nx release publish --tag "$NPM_TAG" $DRY_RUN
        env:
          # npm only accepts provenance from public repositories.
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}

      - name: Create the GitHub release
        if: ${{ github.event_name == 'push' }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
