allowBuilds:
  nx: true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  '@parcel/watcher': true
  # Node-only binaries of transformers.js; the browser build does not need them.
  onnxruntime-node: false
  protobufjs: false
  # Install-time telemetry of a CopilotKit dependency; not needed.
  '@scarf/scarf': false
  # Funding message only.
  core-js: false

# AG-UI asks for zod 3.25 but only imports `zod/v4`, so it can share our zod 4 instead of bundling
# a second copy. CopilotKit and A2UI must stay on zod 3: A2UI reads zod 3 internals and fails to
# load on zod 4. Keep the version equal to zod in package.json.
overrides:
  '@ag-ui/client>zod': 4.6.7
  '@ag-ui/proto>zod': 4.6.7
